name: Verify Logisim Panels experiment
on:
  push:
    branches: [logisim-panels]
    paths: ['experimental/logisim-panels/**', '.github/workflows/logisim-panels.yml']
  pull_request:
    paths: ['experimental/logisim-panels/**', '.github/workflows/logisim-panels.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experimental/logisim-panels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify the official 5.0.0 dependency
        shell: bash
        run: |
          curl --retry 3 -fL https://github.com/logisim-evolution/logisim-evolution/releases/download/v5.0.0/logisim-evolution-5.0.0-all.jar -o vendor/logisim-evolution-5.0.0-all.jar
          echo '6b368e894742c04cc83aa9830f869bcab0190ede4df43ad6fecdb89b3a23a41c  vendor/logisim-evolution-5.0.0-all.jar' | sha256sum --check
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: python scripts/build.py --tests
      - name: Verify on Linux with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/build.py --tests
