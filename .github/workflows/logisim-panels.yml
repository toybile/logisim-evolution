name: Verify Logisim Panels with current native sources
on:
  push:
    branches: [logisim-panels]
    paths: ['src/**', 'build.gradle.kts', 'gradle/**', 'experimental/logisim-panels/**', '.github/workflows/logisim-panels.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Add Windows hex utility for upstream memory tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Verify upstream and Panels on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat --no-daemon --no-configuration-cache test verifyPanels shadowJar
      - name: Verify upstream and Panels on Ubuntu
        if: runner.os == 'Linux'
        run: xvfb-run -a sh ./gradlew --no-daemon --no-configuration-cache test verifyPanels shadowJar
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: build/reports/tests/test
