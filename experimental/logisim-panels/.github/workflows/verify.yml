name: Verify native fork
on: [workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: toybile/logisim-evolution
          ref: logisim-panels
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: xvfb-run -a sh ./gradlew --no-daemon --no-configuration-cache test verifyPanels shadowJar
